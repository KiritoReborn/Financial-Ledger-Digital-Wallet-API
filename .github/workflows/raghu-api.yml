name: Raghu API checks

on: [pull_request, push]

permissions:
  contents: read

jobs:
  api-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint the C-owned API and tests
        run: python -m ruff check backend
      - name: Build the API package
        run: python -m build --outdir "$RUNNER_TEMP/ledger-api-dist"
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/ledger-wheel"
          wheel_python="$RUNNER_TEMP/ledger-wheel/bin/python"
          "$wheel_python" -m pip install "$RUNNER_TEMP"/ledger-api-dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_python" - <<'PY'
          from app.main import create_app

          provider = create_app().state.database
          provider.initialize()
          provider.check()
          with provider.transaction(write=False) as connection:
              assert connection.execute(
                  "SELECT version FROM schema_migrations ORDER BY version"
              ).fetchall() == [(1,), (2,)]
          PY
      - name: Test the API and existing migration tests
        run: python -m pytest -q backend/tests tests
