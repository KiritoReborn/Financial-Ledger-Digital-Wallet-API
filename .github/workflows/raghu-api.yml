name: Raghu API checks

on: [pull_request, push]

permissions:
  contents: read

jobs:
  api-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the API and test dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Lint the C-owned API and tests
        run: python -m ruff check backend
      - name: Build the API package
        run: python -m build backend --outdir "$RUNNER_TEMP/ledger-api-dist"
      - name: Test the API and existing migration tests
        run: python -m pytest -q backend/tests tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install the pinned Prism mock
        run: npm --prefix tools/api-mock ci --ignore-scripts --no-audit --no-fund
      - name: Exercise every mock operation
        run: |
          npm --prefix tools/api-mock start > "$RUNNER_TEMP/prism.log" 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          python scripts/check_api_mock.py || { cat "$RUNNER_TEMP/prism.log"; exit 1; }
